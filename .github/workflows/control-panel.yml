name: Control Panel packages (no publication)
on:
  pull_request:
    paths:
      - 'apps/control-panel/**'
      - 'electron/updateApproval.cjs'
      - 'electron/releaseDelivery.cjs'
      - 'electron/manualUpdater.cjs'
      - 'electron/windowsInstallerUpdate.cjs'
      - 'scripts/audit-control-panel-package.cjs'
      - 'scripts/controlPanelNativeSmoke.ts'
      - 'scripts/controlPanelInstalledSmoke.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/control-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            executable: release/control-panel/win-unpacked/Student Organizer Control Panel.exe
            candidate: release/control-panel/StudentOrganizerControlPanel-0.1.0-x64.exe
            architecture: --x64
            resources: release/control-panel/win-unpacked/resources
          - runner: macos-15
            platform: mac
            executable: release/control-panel/mac-arm64/Student Organizer Control Panel.app/Contents/MacOS/Student Organizer Control Panel
            architecture: --arm64
            resources: release/control-panel/mac-arm64/Student Organizer Control Panel.app/Contents/Resources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck native verification harness
        run: npx tsc --noEmit --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom --types node --skipLibCheck --strict scripts/controlPanelNativeSmoke.ts scripts/controlPanelInstalledSmoke.ts
      - name: Build the separate owner executable (never publish)
        run: npm run control-panel:package:${{ matrix.platform }} -- ${{ matrix.architecture }}
      - name: Audit actual packaged entry and shared contract bytes
        run: node scripts/audit-control-panel-package.cjs "${{ matrix.resources }}"
      - name: Launch actual owner package with disposable fictional profile
        run: node --import tsx scripts/controlPanelNativeSmoke.ts "${{ matrix.executable }}" "${{ matrix.candidate }}"
      - name: Install, exercise and uninstall the exact Windows package
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Copy-Item release/control-panel/native-smoke-win32-x64.json release/control-panel/unpacked-native-smoke-win32-x64.json
          node --import tsx scripts/controlPanelInstalledSmoke.ts "${{ matrix.candidate }}"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Control Panel acceptance failed.' }
      - name: Prepare unpublished Windows installer evidence
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath '${{ matrix.candidate }}'
          $checkout = (git rev-parse HEAD).Trim()
          if ($checkout -ne $env:GITHUB_SHA) { throw 'Checkout does not match CI event SHA.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          New-Item -ItemType Directory -Path release/control-panel/tested-windows | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination release/control-panel/tested-windows/
          $copy = "release/control-panel/tested-windows/$($installer.Name)"
          if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw 'Copied installer hash differs.' }
          @{ checkout = $checkout; event = $env:GITHUB_EVENT_NAME; ref = $env:GITHUB_REF; run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; file = $installer.Name; sha256 = $hash; signatureStatus = $signature.Status.ToString(); publisher = $signature.SignerCertificate.Subject } | ConvertTo-Json | Set-Content -Encoding utf8 release/control-panel/tested-windows/ci-evidence.json
          'UNPUBLISHED TEST PACKAGE. A checksum identifies bytes, not a trusted publisher. Check the recorded Windows signature status; unsigned packages have no verified publisher and Windows may warn or block installation. The checkout may be a synthetic pull-request merge. No release was published.' | Set-Content -Encoding utf8 release/control-panel/tested-windows/README.txt
          Copy-Item release/control-panel/unpacked-native-smoke-win32-x64.json,release/control-panel/installed-native-smoke-win32-x64.json,release/control-panel/installed-acceptance-win32-x64.json release/control-panel/tested-windows/
      - name: Retain tested Windows Control Panel installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ControlPanel-tested-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/control-panel/tested-windows/**
          if-no-files-found: error
          retention-days: 90
      - name: Preserve native verification report only (no installers or private data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ControlPanel-native-smoke-${{ matrix.platform }}
          path: release/control-panel/native-smoke-*.json
          if-no-files-found: ignore
