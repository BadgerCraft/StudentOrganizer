name: Mac packages and shared browser checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-ipad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QA_ARCH: ${{ matrix.arch }}
      VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require credential-free test signature
        run: node -e "if (require('./package.json').build.mac.identity !== '-') throw new Error('This PR job only allows an ad-hoc test signature')"
      - name: Prepare pinned local speech runtime (no model)
        run: npm run dictation:prepare -- --arch=${{ matrix.arch }}
      - name: Package Mac disk image and archive
        run: npm run package:mac -- --${{ matrix.arch }} --publish never
        env:
          # v26 otherwise skips even ad-hoc signatures on pull requests.
          # No certificate, keychain secret, publishing token or notarization credential is supplied.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check packaged local speech runtime without audio
        run: node scripts/dictationRuntimeSmoke.cjs "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Ontario Teacher Assessment.app/Contents/Resources/dictation-runtime" "release/dictation-runtime-${{ matrix.arch }}.json"
      - name: Launch actual disk-image and archive apps; check restart persistence
        run: npm run test:mac:packages
      - name: Compile bundled iOS app without credentials
        # F-006 shelved October 14; restore this gate only after renewed approval.
        # Resume map: docs/SHELVED_FEATURES.md and docs/IPAD_SUPPORT.md.
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Use an installed compatible Xcode only; never download tools or sign.
          selected_developer_dir=""
          for candidate in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            if [[ ! -d "$candidate" ]]; then continue; fi
            version=$(DEVELOPER_DIR="$candidate" xcodebuild -version | awk '/^Xcode / {print $2}')
            if [[ "${version%%.*}" =~ ^[0-9]+$ ]] && (( ${version%%.*} >= 26 )); then
              selected_developer_dir="$candidate"
              break
            fi
          done
          if [[ -z "$selected_developer_dir" ]]; then
            echo "Native compile unavailable: this runner has no installed Xcode 26 or later. No tools were downloaded." | tee release/ios-build.log
            exit 1
          fi
          export DEVELOPER_DIR="$selected_developer_dir"
          {
            xcodebuild -version
            npm run ios:prepare
            npm run test:ipad:assets
            xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath release/ios-derived CODE_SIGNING_ALLOWED=NO build
          } 2>&1 | tee release/ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OntarioTeacherAssessment-Mac-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            release/*.dmg
            release/*.zip
            release/mac-smoke/**
            release/dictation-runtime-*.json
            release/ios-build.log
          if-no-files-found: error
          retention-days: 90
  browser:
    runs-on: ubuntu-latest
    # Match package-lock.json; browsers and system dependencies are included.
    # Avoid repeated Ubuntu mirror installs after the observed dependency timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    timeout-minutes: 20
    env:
      VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require matching preinstalled browser engines
        run: |
          node -e "const { version } = require('playwright/package.json'); if (version !== '1.63.0') throw new Error('Update browser image and lockfile together'); const fs = require('node:fs'); const { chromium, webkit } = require('playwright'); [chromium, webkit].forEach(engine => fs.accessSync(engine.executablePath()));"
      - name: Verify domain and focused-workflow regressions
        run: |
          npm test
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run test:focused-organizer
          BROWSER_ENGINE=webkit npm run test:marking:keyboard
      - name: Check bundled classroom and recovery flows in Chromium
        run: node --import tsx scripts/nativePilotSmoke.ts
      - name: Check Markinator production and expanded acceptance
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run test:marking:browser
          npm run test:marking:category-recovery
          npm run test:marking:acceptance
          npm run test:marking:modes-photo
          npm run test:marking:pdf
          npm run test:marking:archive
      - name: Check classroom-use setup, matching, saved results and popup
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run test:dictation:browser
          npm run test:classroom
          npm run test:qa:integrity
          npm run test:desktop:photo-reliability
      - name: Check WebKit browser compatibility
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/nativePilotSmoke.ts
        env:
          IPAD_TEST_BROWSER: webkit
      - name: Check bug-report draft recovery and failures
        if: ${{ !cancelled() }}
        run: node --import tsx src/benchmarks/bugReportSmokeTest.ts
      - name: Check approved UI repairs in Chromium
        run: node --import tsx scripts/uiRepairsSmoke.ts
      - name: Check approved UI repairs in WebKit
        if: ${{ !cancelled() }}
        run: node --import tsx scripts/uiRepairsSmoke.ts
        env:
          UI_TEST_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-browser-evidence-${{ github.run_number }}
          path: |
            screenshots/**
            /tmp/annotation-feedback-results.json
            /tmp/annotation-feedback.png
            /tmp/markinator-modes-photo-results.json
            /tmp/desktop-photo-*
            /tmp/student-chiclet-names*
            /tmp/desktop-chiclet-*
            /tmp/desktop-crop-*
            /tmp/capture-preview-scheduling-*
            /tmp/capture-loading-retry-*
            /tmp/markinator-modes-photo-*.png
            /tmp/annotated-report-smoke*
            /tmp/markinator-archive*
          if-no-files-found: warn
          retention-days: 90
