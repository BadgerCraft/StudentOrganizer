name: Windows desktop build

on:
  push:
    branches: [main]
    tags: ['qa-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Keep every test file, while separating native PowerShell startup and
      # FULL SQLite fixtures from the remaining suite's parallel I/O.
      - name: Run native observer and structured storage tests serially
        timeout-minutes: 10
        run: npx vitest run scripts/helpers/installRecoveryFixture.test.ts src/security/structuredWorkspace.test.ts --no-file-parallelism --maxWorkers=1 --minWorkers=1
      - name: Run remaining full test suite
        run: npm test -- --exclude scripts/helpers/installRecoveryFixture.test.ts --exclude src/security/structuredWorkspace.test.ts
      - name: Prepare pinned local speech runtime (no model)
        run: npm run dictation:prepare
      - name: Identify QA build
        run: node scripts/prepare-qa-build.cjs
      - name: Build Windows installer and portable app
        run: npm run package:win -- --publish never "--config.extraMetadata.version=$env:QA_VERSION"
      - name: Check packaged local speech runtime without audio
        run: node scripts/dictationRuntimeSmoke.cjs release/win-unpacked/resources/dictation-runtime
      - name: Verify Windows local credential receipt storage with synthetic metadata
        run: node scripts/windowsCredentialLedgerSmoke.cjs
      - name: Verify packaged encrypted SQLite storage with synthetic bytes
        run: npx tsx src/benchmarks/encryptionNativeSmoke.ts
      - name: Check actual packaged PDF renderer and controlled save cancellation
        run: npx tsx src/benchmarks/reportPdfDesktopSmoke.ts
      - name: Check actual installed update IPC boundary before replacement builds
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts --ipc-boundary-only
      - name: Test actual portable and installed apps
        run: npx tsx src/benchmarks/windowsPackagesSmoke.ts
      - name: Check assessment creation in packaged app
        run: npx tsx src/benchmarks/assessmentDesktopSmoke.ts
      - name: Check local resource policy and authorized profile save
        run: npx tsx src/benchmarks/securityDesktopSmoke.ts
      - name: Build isolated stable A and B installers for replacement acceptance
        run: |
          npx electron-builder --win nsis --publish never --config.directories.output=release/upgrade-A --config.extraMetadata.version=1.0.1
          npx electron-builder --win nsis --publish never --config.directories.output=release/upgrade-B --config.extraMetadata.version=1.0.2
      - name: Test production download, backup, installer replacement and reopen
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts
      - name: Prepare unpublished tested installer candidate
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'release/upgrade-B/*-x64-nsis.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one tested x64 installer.' }
          $installer = $installers[0]
          $tested = Get-Content release/qa-evidence/windows-upgrade/upgrade-results.json -Raw | ConvertFrom-Json
          $checkout = (git rev-parse HEAD).Trim()
          if ($checkout -ne $env:GITHUB_SHA) { throw 'Checkout does not match the CI event SHA.' }
          New-Item -ItemType Directory -Path release/tested-candidate | Out-Null
          Copy-Item $installer.FullName release/tested-candidate/
          $copy = "release/tested-candidate/$($installer.Name)"
          if ((Get-FileHash $copy -Algorithm SHA256).Hash.ToLower() -ne $tested.installers.B.sha256) { throw 'Candidate does not match the installer used in acceptance.' }
          node scripts/prepare-update-candidate.cjs $copy 1.0.2 x64 $checkout release/tested-candidate/candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate descriptor preparation failed.' }
          @{ checkout = $checkout; event = $env:GITHUB_EVENT_NAME; ref = $env:GITHUB_REF; run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; testedInstallerSha256 = $tested.installers.B.sha256 } | ConvertTo-Json | Set-Content -Encoding utf8 release/tested-candidate/ci-evidence.json
          'UNPUBLISHED TEST CANDIDATE: version 1.0.2 is an acceptance fixture and this QA build may be unsigned. The checkout can be a synthetic pull-request merge, not final main. The hash binds the tested installer; it does not prove publisher identity. This is not an approved or published release. Review source, version, publisher trust and exact bytes before any separate publication decision.' | Set-Content -Encoding utf8 release/tested-candidate/README.txt
      - name: Retain unpublished tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: Windows-tested-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/tested-candidate/**
          if-no-files-found: error
          retention-days: 90
      - name: Record checksums and Windows publisher status
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe
          $report = @($files | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            [ordered]@{
              file = $_.Name
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              signatureStatus = $signature.Status.ToString()
              publisher = $signature.SignerCertificate.Subject
            }
          })
          $report | ConvertTo-Json -Depth 4 | Tee-Object -FilePath release/windows-files.json
          $report | ForEach-Object { "$($_.sha256)  $($_.file)" } | Set-Content release/SHA256SUMS.txt
          Copy-Item docs/WINDOWS_QA.md release/QA-GUIDE.md
      - name: Upload Windows QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: OntarioTeacherAssessment-Windows-${{ env.QA_VERSION }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/qa-build.json
            release/windows-files.json
            release/SHA256SUMS.txt
            release/QA-GUIDE.md
            release/package-smoke.json
            release/qa-evidence/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-QA-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/qa-evidence/
          if-no-files-found: ignore
          retention-days: 14

  # The production renderer is built without a QA identity on a fresh runner.
  # This is an unpublished candidate, never a release or owner approval.
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SOURCE: 46afbde6efad0f7dbb3ef60d1882c7a10d02ea4f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 46afbde6efad0f7dbb3ef60d1882c7a10d02ea4f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare production renderer and local speech runtime
        shell: pwsh
        run: |
          if (Test-Path Env:VITE_QA_BUILD_ID) { throw 'Candidate must not carry a QA build identity.' }
          npm run dictation:prepare
          if ($LASTEXITCODE -ne 0) { throw 'Speech runtime preparation failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Production build failed.' }
      - name: Build unpublished x64 A and B installers
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never --config.directories.output=release/upgrade-A --config.extraMetadata.version=1.0.1
          if ($LASTEXITCODE -ne 0) { throw 'A installer build failed.' }
          npx electron-builder --win nsis --x64 --publish never --config.directories.output=release/upgrade-B --config.extraMetadata.version=1.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Candidate installer build failed.' }
      - name: Test actual candidate upgrade and reopen with fictional data
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts
      - name: Verify Control Panel preparation with candidate installer bytes
        shell: pwsh
        run: |
          npm run control-panel:package:win -- --x64
          if ($LASTEXITCODE -ne 0) { throw 'Control Panel package build failed.' }
          node --import tsx scripts/controlPanelNativeSmoke.ts 'release/control-panel/win-unpacked/Student Organizer Control Panel.exe' 'release/upgrade-B/OntarioTeacherAssessment-1.0.2-x64-nsis.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Control Panel candidate preparation failed.' }
      - name: Prepare exact unpublished candidate and evidence
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'release/upgrade-B/OntarioTeacherAssessment-1.0.2-x64-nsis.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one candidate installer.' }
          $tested = Get-Content release/qa-evidence/windows-upgrade/upgrade-results.json -Raw | ConvertFrom-Json
          $checkout = (git rev-parse HEAD).Trim()
          if ($checkout -ne $env:CANDIDATE_SOURCE) { throw 'Checkout differs from the pinned merged source.' }
          New-Item -ItemType Directory -Path release/unpublished-candidate | Out-Null
          Copy-Item $installers[0].FullName release/unpublished-candidate/
          $file = "release/unpublished-candidate/$($installers[0].Name)"
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $tested.installers.B.sha256) { throw 'Candidate does not match the accepted installer.' }
          node scripts/prepare-update-candidate.cjs $file 1.0.2 x64 $checkout release/unpublished-candidate/candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Candidate descriptor failed.' }
          $descriptor = Get-Content release/unpublished-candidate/candidate.json -Raw | ConvertFrom-Json
          $sha512 = (Get-FileHash $file -Algorithm SHA512).Hash.ToLower()
          $descriptorSha512 = [Convert]::ToHexString([Convert]::FromBase64String($descriptor.artifact.sha512)).ToLower()
          if ($sha512 -ne $descriptorSha512 -or $descriptor.artifact.bytes -ne (Get-Item $file).Length -or $descriptor.sourceCommit -ne $checkout) { throw 'Candidate descriptor does not match retained bytes and checkout.' }
          $signature = Get-AuthenticodeSignature $file
          @{ checkout = $checkout; workflowHead = $env:GITHUB_SHA; event = $env:GITHUB_EVENT_NAME; ref = $env:GITHUB_REF; run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; sha256 = $sha; signature = $signature.Status.ToString(); publisher = $signature.SignerCertificate.Subject; origin = '1.0.1 same-source NSIS fictional-data acceptance'; version = '1.0.2' } | ConvertTo-Json | Set-Content -Encoding utf8 release/unpublished-candidate/ci-evidence.json
          @'
          UNPUBLISHED WINDOWS X64 CANDIDATE — NOT A RELEASE

          Version 1.0.2 is provisional. This package was built without a QA renderer identity and tested using fictional data against a same-source 1.0.1 installation. The separately recorded legacy bootstrap and failed-installer recovery tests have their own artifacts and limits.

          In the Windows Control Panel, choose Import candidate + verify installer, select candidate.json and the accompanying NSIS installer, and compare the displayed SHA-512 with the exact tested bytes and CI evidence. Record only checks actually performed; local approval and preparation do not publish or cause an update. Keep the installer and descriptor together.

          Inspect ci-evidence.json for Windows signature status. Unsigned means the publisher is not verified; a checksum verifies bytes, not identity. The candidate source is pinned merged commit 46afbde; the workflow head may be a different synthetic pull-request merge. Confirm the pinned source is still the intended release source before approval. Physical-device acceptance and any publication decision are separate.
          '@ | Set-Content -Encoding utf8 release/unpublished-candidate/README.txt
      - name: Retain unpublished candidate only after acceptance
        uses: actions/upload-artifact@v4
        with:
          name: StudentOrganizer-unpublished-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/unpublished-candidate/**
            release/qa-evidence/windows-upgrade/upgrade-results.json
            release/control-panel/native-smoke-win32-x64.json
          if-no-files-found: error
          retention-days: 90

  # A fresh runner avoids another smoke test's registered app or profile being
  # mistaken for the actual legacy installation. No release token is supplied.
  legacy-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Build current stable bootstrap destination
        run: |
          npm run build
          npx electron-builder --win nsis --publish never --config.directories.output=release/upgrade-B --config.extraMetadata.version=1.0.2
      - name: Check out the actual pre-updater bootstrap source
        uses: actions/checkout@v4
        with:
          ref: b9a8790f4841fa9fd5057e7cfef097f619cbac4a
          path: .legacy-bootstrap-source
          persist-credentials: false
      - name: Build the pinned metadata-only legacy installer
        working-directory: .legacy-bootstrap-source
        run: |
          npm ci
          npm run build
          npx electron-builder --win nsis --publish never --config.directories.output=../release/bootstrap-A --config.extraMetadata.version=1.0.0
      - name: Test deliberate legacy bootstrap and old-backup recovery
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts --legacy-bootstrap --acknowledge-unsigned
      - name: Retain actual bootstrap evidence and installer hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-legacy-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/qa-evidence/windows-bootstrap/**
            release/bootstrap-A/*-nsis.exe
            release/upgrade-B/*-nsis.exe
          if-no-files-found: warn
          retention-days: 90

  # Deterministically damages only a disposable hosted-runner installation
  # after the production updater has launched NSIS and saved its verified
  # backup. This proves repair/reinstall plus real UI backup recovery; it is not
  # represented as a physical power-loss or managed-device test.
  install-recovery:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build stable A, deliberate failing B and repair B installers
        run: |
          npm run build
          npx electron-builder --win nsis --publish never --config.directories.output=release/recovery-A --config.extraMetadata.version=1.0.1
          npx electron-builder --win nsis --publish never --config.directories.output=release/recovery-failure-B --config.extraMetadata.version=1.0.2 --config.nsis.include=scripts/windowsInstallFailureFixture.nsh
          npx electron-builder --win nsis --publish never --config.directories.output=release/recovery-B --config.extraMetadata.version=1.0.2
      - name: Test post-launch failure, repair and verified backup recovery
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts --install-recovery --acknowledge-unsigned
      - name: Retain recovery evidence and exact fixture installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-install-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/qa-evidence/windows-install-recovery/**
            release/recovery-A/*-nsis.exe
            release/recovery-failure-B/*-nsis.exe
            release/recovery-B/*-nsis.exe
          if-no-files-found: warn
          retention-days: 90

  # Publishing is explicit: only a reviewed QA tag creates a lasting prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/qa-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified QA bundle
        uses: actions/download-artifact@v4
        with:
          pattern: OntarioTeacherAssessment-Windows-*
          path: qa-bundle
          merge-multiple: true
      - name: Publish reviewed QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QA_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$QA_TAG" qa-bundle/*.exe qa-bundle/*.json qa-bundle/*.txt qa-bundle/*.md --verify-tag --prerelease --title "Windows fictional-data QA: $QA_TAG" --notes-file qa-bundle/QA-GUIDE.md
