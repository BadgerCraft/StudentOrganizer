name: Windows desktop build

on:
  push:
    branches: [main]
    tags: ['qa-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Identify QA build
        run: node scripts/prepare-qa-build.cjs
      - name: Build Windows installer and portable app
        run: npm run package:win -- --publish never "--config.extraMetadata.version=$env:QA_VERSION"
      - name: Check actual installed update IPC boundary before replacement builds
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts --ipc-boundary-only
      - name: Test actual portable and installed apps
        run: npx tsx src/benchmarks/windowsPackagesSmoke.ts
      - name: Check assessment creation in packaged app
        run: npx tsx src/benchmarks/assessmentDesktopSmoke.ts
      - name: Check local resource policy and authorized profile save
        run: npx tsx src/benchmarks/securityDesktopSmoke.ts
      - name: Build isolated stable A and B installers for replacement acceptance
        run: |
          npx electron-builder --win nsis --publish never --config.directories.output=release/upgrade-A --config.extraMetadata.version=1.0.1
          npx electron-builder --win nsis --publish never --config.directories.output=release/upgrade-B --config.extraMetadata.version=1.0.2
      - name: Test production download, backup, installer replacement and reopen
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts
      - name: Record checksums and Windows publisher status
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe
          $report = @($files | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            [ordered]@{
              file = $_.Name
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              signatureStatus = $signature.Status.ToString()
              publisher = $signature.SignerCertificate.Subject
            }
          })
          $report | ConvertTo-Json -Depth 4 | Tee-Object -FilePath release/windows-files.json
          $report | ForEach-Object { "$($_.sha256)  $($_.file)" } | Set-Content release/SHA256SUMS.txt
          Copy-Item docs/WINDOWS_QA.md release/QA-GUIDE.md
      - name: Upload Windows QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: OntarioTeacherAssessment-Windows-${{ env.QA_VERSION }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/qa-build.json
            release/windows-files.json
            release/SHA256SUMS.txt
            release/QA-GUIDE.md
            release/package-smoke.json
            release/qa-evidence/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-QA-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/qa-evidence/
          if-no-files-found: ignore
          retention-days: 14

  # A fresh runner avoids another smoke test's registered app or profile being
  # mistaken for the actual legacy installation. No release token is supplied.
  legacy-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Build current stable bootstrap destination
        run: |
          npm run build
          npx electron-builder --win nsis --publish never --config.directories.output=release/upgrade-B --config.extraMetadata.version=1.0.2
      - name: Check out the actual pre-updater bootstrap source
        uses: actions/checkout@v4
        with:
          ref: b9a8790f4841fa9fd5057e7cfef097f619cbac4a
          path: .legacy-bootstrap-source
          persist-credentials: false
      - name: Build the pinned metadata-only legacy installer
        working-directory: .legacy-bootstrap-source
        run: |
          npm ci
          npm run build
          npx electron-builder --win nsis --publish never --config.directories.output=../release/bootstrap-A --config.extraMetadata.version=1.0.0
      - name: Test deliberate legacy bootstrap and old-backup recovery
        run: npx tsx src/benchmarks/windowsUpgradeSmoke.ts --legacy-bootstrap --acknowledge-unsigned
      - name: Retain actual bootstrap evidence and installer hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-legacy-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/qa-evidence/windows-bootstrap/**
            release/bootstrap-A/*-nsis.exe
            release/upgrade-B/*-nsis.exe
          if-no-files-found: warn
          retention-days: 90

  # Publishing is explicit: only a reviewed QA tag creates a lasting prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/qa-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified QA bundle
        uses: actions/download-artifact@v4
        with:
          pattern: OntarioTeacherAssessment-Windows-*
          path: qa-bundle
          merge-multiple: true
      - name: Publish reviewed QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QA_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$QA_TAG" qa-bundle/*.exe qa-bundle/*.json qa-bundle/*.txt qa-bundle/*.md --verify-tag --prerelease --title "Windows fictional-data QA: $QA_TAG" --notes-file qa-bundle/QA-GUIDE.md
