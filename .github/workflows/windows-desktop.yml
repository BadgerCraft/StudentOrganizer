name: Windows desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Windows installer and portable app
        run: npm run package:win -- --publish never
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: OntarioTeacherAssessment-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
